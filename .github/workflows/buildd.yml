name: Build MNN Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "25.2.9519653"

    steps:
      - name: Checkout MNN source code
        uses: actions/checkout@v4

      # —— 制 JDK 11 ——
      # 先用 JDK17 让 setup-android 的 sdkmanager(16.0) 能跑，再切回 11 给 Gradle
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # —— 安装 NDK 与 CMake ——
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }} cmake;3.22.1'

      - name: Set NDK Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # —— local.properties 配置 sdk.dir / ndk.dir ——
      - name: Generate local.properties
        run: |
          cat > project/android/demo/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}
          EOF
          cat project/android/demo/local.properties

      # —— 切回 JDK 11 给 MNN 旧 Gradle 用 ——
      - name: Set up JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # —— org.junit 不存在 → 注入 junit:4.12 ——
      - name: Inject junit dependency
        run: |
          cd project/android/demo
          # 在 dependencies 块里追加 testImplementation junit:4.12
          sed -i "/dependencies {/a\\    testImplementation 'junit:junit:4.12'" app/build.gradle
          echo "=== patched dependencies ==="
          grep -A2 "dependencies {" app/build.gradle

      # —— 阿里云镜像，避免国外 Maven 拉取失败 ——
      - name: Configure Gradle Aliyun Mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<EOF
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/jcenter' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./project/android/demo/gradlew

      # —— 构建：限制并发，缓解 runner 7G 内存被 OOM 杀 ——
      - name: Build Debug APK
        run: |
          cd project/android/demo
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.workers.max=2

      # —— 对应博客产物路径：app/build/outputs/apk/debug ——
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-Android-APK
          path: project/android/demo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
