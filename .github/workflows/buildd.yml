name: Build MNN Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "25.2.9519653"

    steps:
      - name: Checkout MNN source code
        uses: actions/checkout@v4

      # —— 第一步：先用 JDK 17，让 setup-android 的 sdkmanager 能跑 ——
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }} cmake;3.22.1'

      - name: Set NDK Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # —— 第二步：切回 JDK 11，给 MNN 的旧 Gradle 用 ——
      - name: Set up JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Show Java version (sanity check)
        run: java -version

      - name: Grant execute permission for gradlew
        run: chmod +x ./project/android/demo/gradlew

      - name: Build Debug APK
        run: |
          cd project/android/demo
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-Android-APK
          path: project/android/demo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
